name: Deploy development to Cloud Run
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-gcp-development
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: tutor-ai-514808
      REGION: asia-southeast1
      IMAGE_BASE: asia-southeast1-docker.pkg.dev/tutor-ai-514808/tutor-ai
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build images
        run: |
          docker build --target web -t "$IMAGE_BASE/web:$GITHUB_SHA" .
          docker build --target worker -t "$IMAGE_BASE/worker:$GITHUB_SHA" .
      - name: Verify PDF and OCR runtime
        run: docker run --rm --volume "$PWD/tests:/app/tests:ro" --entrypoint node "$IMAGE_BASE/worker:$GITHUB_SHA" --import tsx --test tests/integration/pdf.integration.ts
      - name: Push images
        run: |
          docker push "$IMAGE_BASE/web:$GITHUB_SHA"
          docker push "$IMAGE_BASE/worker:$GITHUB_SHA"
      - name: Deploy web and worker
        env:
          RUNTIME_ENV_JSON: ${{ secrets.TUTOR_RUNTIME_ENV_JSON }}
        run: |
          set -euo pipefail
          umask 077
          env_file=$(mktemp)
          trap 'rm -f "$env_file"' EXIT
          python3 -c 'import json,os,sys; v=json.loads(os.environ["RUNTIME_ENV_JSON"]); assert v, "Missing runtime configuration"; json.dump(v,open(sys.argv[1],"w"))' "$env_file"
          gcloud run deploy tutor-ai-dev --project="$PROJECT_ID" --region="$REGION" --image="$IMAGE_BASE/web:$GITHUB_SHA" --env-vars-file="$env_file" --quiet
          python3 -c 'import json,sys; p=sys.argv[1]; v=json.load(open(p)); keys=["DATABASE_URL","SUPABASE_URL","SUPABASE_SERVICE_ROLE_KEY","SUPABASE_STORAGE_BUCKET","GEMINI_API_KEY"]; json.dump({k:v[k] for k in keys if k in v},open(p,"w"))' "$env_file"
          gcloud run jobs deploy tutor-material-worker-dev --project="$PROJECT_ID" --region="$REGION" --image="$IMAGE_BASE/worker:$GITHUB_SHA" --env-vars-file="$env_file" --quiet
      - name: Clean up old Artifact Registry images
        env:
          ARTIFACT_REGISTRY_KEEP_COUNT: "10"
        run: python3 scripts/cleanup-artifact-registry.py
